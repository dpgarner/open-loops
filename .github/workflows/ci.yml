name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded pull request runs are cancelled; pushes to main queue instead.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  test-and-build:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Report both platforms even when one fails.
      fail-fast: false
      matrix:
        # The app is developed on Windows and published from Linux.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the Node used to develop and test this locally.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated docs
        run: npm run docs:check

      - name: Run the Jest suite
        # Coverage turns on the thresholds in jest.config.cjs.
        run: npm run test:coverage

      - name: Upload the coverage report
        # Always, so a run that fails the thresholds still leaves the report behind.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          retention-days: 14

      - name: Type-check and build
        run: npm run build
